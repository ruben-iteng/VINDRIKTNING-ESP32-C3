requires-atopile: 0.8.1

paths:
  src: ./
  layout: ./layouts
  footprints: ./footprints

builds:
  default:
    entry: src/vindriktning/main.ato:App
    #fail_on_drcs: false
    keep_picked_parts: true
    hide_designators: true
    targets:
      - bom
      - mfg-data
  fan_controller:
    entry: src/vindriktning/blocks/fan_controller.ato:FanController
    keep_picked_parts: true
    keep_picked_parts: true

dependencies:
- type: registry
  identifier: ruben-iteng/ldos
  release: 0.2.2
- type: registry
  identifier: ruben-iteng/esp32c3
  release: 0.2.2
- type: registry
  identifier: ruben-iteng/leds
  release: 0.2.1
- type: registry
  identifier: ruben-iteng/logic
  release: 0.2.1
- type: registry
  identifier: ruben-iteng/connectors
  release: 0.2.2
- type: registry
  identifier: ruben-iteng/logos
  release: 0.1.3
- type: registry
  identifier: atopile/indicator-leds
  release: 0.1.1
- type: registry
  identifier: ruben-iteng/rohm-semiconductor-bh1750fvi
  release: 0.1.0
- type: registry
  identifier: ruben-iteng/usb
  release: 0.3.0
